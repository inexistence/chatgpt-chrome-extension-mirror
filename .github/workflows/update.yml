name: Mirror Chrome extension

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest package
        id: extension
        run: python3 scripts/update_extension.py

      - name: Commit version marker
        if: steps.extension.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/version.txt
          git commit -m "chore: mirror ChatGPT extension ${{ steps.extension.outputs.version }}"
          git push

      - name: Publish GitHub Release
        if: steps.extension.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.extension.outputs.version }}"
          name: "ChatGPT Chrome Extension ${{ steps.extension.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/chatgpt-extension.crx
            dist/chatgpt-extension.zip
            dist/SHA256SUMS
